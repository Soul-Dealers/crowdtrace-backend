name: Web

# Checks apps/web on pull requests and pushes; deploys to Vercel after the checks pass:
# main -> production, dev -> preview (the dev environment).
# Runs only when the frontend or the workspace files it builds from change.
on:
  push:
    branches: [main, dev]
    paths: &web-paths
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - '.github/workflows/web-deploy.yml'
  pull_request:
    branches: [main, dev]
    paths: *web-paths
  workflow_dispatch:

concurrency:
  group: web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web --if-present test

      - name: Build
        run: pnpm --filter web build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm add --global vercel@latest

      # Run from the repo root: the Vercel project's Root Directory (apps/web) is applied by the CLI.
      - name: Pull Vercel settings and env vars
        run: vercel pull --yes --environment=$VERCEL_ENV --git-branch=${{ github.ref_name }} --token=${{ secrets.VERCEL_TOKEN }}

      # Rebuilt here with the environment's own variables (NEXT_PUBLIC_API_URL is baked in at build time).
      - name: Build
        run: vercel build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      # Stable URL for dev, e.g. dev.ovrhr.akato.dev (set repo variable VERCEL_DEV_DOMAIN).
      - name: Alias dev deployment
        if: github.ref_name == 'dev' && vars.VERCEL_DEV_DOMAIN != ''
        run: vercel alias set ${{ steps.deploy.outputs.url }} ${{ vars.VERCEL_DEV_DOMAIN }} --token=${{ secrets.VERCEL_TOKEN }}
