name: Verify

# The same checks the verify skill runs, on every PR. A PR can edit this file, so CODEOWNERS routes changes to it
# (and to .claude/ and REVIEW.md) to the owner; turn on "Require review from Code Owners" for main and dev.
# Backend tests use embedded PostgreSQL (no Docker); only @Tag("docker") tests need the runner's Docker.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: surefire-reports, path: target/surefire-reports }

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B test -Dgroups=docker -Dtest.excludedGroups=
      # Fail if the filter silently matched nothing.
      - run: ls target/surefire-reports/TEST-*S3FileStorageTest.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter web test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: ./mvnw -B -q test-compile # warm the build so the server starts inside Playwright's timeout
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env: { CI: 'true' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report }
