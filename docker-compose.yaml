services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowdtrace}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be set}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3 for case files. A backend on the host uses the CROWDTRACE_STORAGE_S3_* values from example.env;
  # the app service below uses localhost.localstack.cloud, which public DNS sends to 127.0.0.1 for the browser
  # and the alias sends to this container for the app, so presigned URLs work from both sides.
  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      CROWDTRACE_STORAGE_S3_BUCKET: ${CROWDTRACE_STORAGE_S3_BUCKET:-crowdtrace-case-files}
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - ./localstack/seed:/etc/localstack/seed:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Loads the dummy data in db/dev-seed. Set only here, never in a profile file.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crowdtrace}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-local-api-key}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@example.com}
      # Without a bucket the app keeps files in memory, which cannot sign photo links and loses uploads on restart.
      CROWDTRACE_STORAGE_S3_BUCKET: ${CROWDTRACE_STORAGE_S3_BUCKET:-crowdtrace-case-files}
      CROWDTRACE_STORAGE_S3_REGION: us-east-1
      CROWDTRACE_STORAGE_S3_ENDPOINT: http://localhost.localstack.cloud:4566
      CROWDTRACE_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

volumes:
  postgres-data:
