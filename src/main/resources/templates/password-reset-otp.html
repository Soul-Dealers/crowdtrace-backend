<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your CrowdTrace password</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 40px 20px; background-color: #f5f5f5;">
<main style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);">
    <h1 style="margin: 0 0 8px; font-size: 24px; color: #111111;">Reset your password</h1>
    <p style="margin: 0 0 32px; color: #666666; font-size: 16px;">
        Hi <span th:text="${userName}">there</span>, use this code to reset your CrowdTrace password.
    </p>
    <p style="margin: 0 0 32px; background: #f8f9fa; border-radius: 8px; padding: 24px; color: #111111; font-size: 36px; font-weight: 700; letter-spacing: 8px; text-align: center;">
        <span th:text="${otpCode}">123456</span>
    </p>
    <p style="margin: 0; color: #999999; font-size: 14px;">
        This code expires in 5 minutes. Do not share it with anyone.
    </p>
</main>
</body>
</html>
