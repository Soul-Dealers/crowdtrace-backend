<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CrowdTrace</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 40px 20px; background-color: #f5f5f5;">
<main style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);">
    <h1 style="margin: 0 0 8px; font-size: 24px; color: #111111;">Welcome to CrowdTrace</h1>
    <p style="margin: 0 0 24px; color: #666666; font-size: 16px;">
        Hi <span th:text="${userName}">there</span>, your account is verified and ready to use.
    </p>
    <p style="margin: 0; color: #999999; font-size: 14px;">
        Thank you for helping make information about missing people easier to find and share responsibly.
    </p>
</main>
</body>
</html>
