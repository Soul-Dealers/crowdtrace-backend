<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your case was updated</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 40px 20px; background-color: #f5f5f5;">
<main style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);">
    <h1 style="margin: 0 0 8px; font-size: 24px; color: #111111;">Your case was updated</h1>
    <p style="margin: 0 0 24px; color: #666666; font-size: 16px;">
        <span th:text="|Case ${caseId}|">Case</span> is now marked
        <strong th:text="${statusLabel}" style="color: #111111;">updated</strong>.
    </p>
    <p style="margin: 0 0 24px;">
        <a th:href="${caseUrl}" style="display: inline-block; background: #111111; color: #ffffff; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-size: 14px;">View your case</a>
    </p>
    <p style="margin: 0; color: #999999; font-size: 14px;">
        You are receiving this because you reported this case on CrowdTrace.
    </p>
</main>
</body>
</html>
