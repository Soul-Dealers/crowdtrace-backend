spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

management:
  endpoint:
    health:
      show-details: always


resend:
  api-key: test-api-key
  from-email: test@test.com

aws:
  s3:
    bucket-name: test-bucket
    region: us-east-1
    base-url: https://test-bucket.s3.us-east-1.amazonaws.com

logging:
  level:
    com.souldealers.vendor_space: DEBUG
    org.springframework.security: INFO

# Deterministic test-only JWT configuration.
secret-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt-token-expiration: 3600
