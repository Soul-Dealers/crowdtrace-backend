spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

management:
  endpoint:
    health:
      show-details: always


resend:
  url: https://api.resend.com/emails
  api-key: test-api-key
  from-email: test@test.com

aws:
  s3:
    bucket-name: test-bucket
    region: us-east-1
    base-url: https://test-bucket.s3.us-east-1.amazonaws.com

logging:
  level:
    com.souldealers.vendor_space: DEBUG
    org.springframework.security: INFO

# Deterministic test-only JWT configuration.
secret-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt:
  access-token-expiry: 900

otp:
  hmac-secret: dGVzdC1vdHAtaG1hYy1zZWNyZXQtZm9yLWF1dG9tYXRlZC10ZXN0cw==

# H2 cannot execute the PostgreSQL ON CONFLICT upsert the limiter is built on
# (error 42000-240, measured in the CT-007 review), and Flyway is disabled here
# so V8 never creates the table. The rate-limit tests opt back in with
# rate-limit.enabled=true against a Testcontainers PostgreSQL.
rate-limit:
  enabled: false
  hmac-secret: dGVzdC1yYXRlLWxpbWl0LWhtYWMtc2VjcmV0LWZvci1hdXRvbWF0ZWQtdGVzdHM=
