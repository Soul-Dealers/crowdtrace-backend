spring:
  application:
    name: crowdtrace-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# JWT Configuration
server:
  port: 8080

jwt:
  access-token-expiry: 900
  refresh-token-expiry: 86400
  remember-me-expiry: 2592000
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem
  issuer: vendor-space
  key-path: certs/private.pem
  key-rotation-interval: 0

otp:
  hmac-secret: ${OTP_HMAC_SECRET:ZGV2LW90cC1obWFjLXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=}

# Resend Email Configuration
resend:
  url: "https://api.resend.com/emails"
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

# AWS Configuration
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:vendor-space-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    base-url: ${AWS_S3_BASE_URL:https://vendor-space-bucket.s3.us-east-1.amazonaws.com}


# Logging
logging:
  level:
    com.souldealers.crowdtracebackend: DEBUG
    org.springframework.security: INFO
    org.flywaydb: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n"

cors:
  allowed-origins:
    - "https://crowdtrace.com"
    - "https://www.crowdtrace.com"

secret-key: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
