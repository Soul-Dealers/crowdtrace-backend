spring:
  application:
    name: crowdtrace-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


# JWT Configuration
server:
  port: 8080

jwt:
  access-token-expiry: 900
  refresh-token-expiry: 86400
  remember-me-expiry: 2592000
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem
  issuer: vendor-space
  key-path: certs/private.pem
  key-rotation-interval: 0

# Resend Email Configuration
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

# AWS Configuration
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:vendor-space-bucket}
    region: ${AWS_S3_REGION:us-east-1}
    base-url: ${AWS_S3_BASE_URL:https://vendor-space-bucket.s3.us-east-1.amazonaws.com}


# Logging
logging:
  level:
    com.souldealers.vendor_space: DEBUG
    org.springframework.security: INFO
    org.flywaydb: DEBUG
